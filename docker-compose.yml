services:
  api:
    build: .
    image: syncmark-demo-api
    environment: {PYTHONPATH: /app/src}
    volumes: [".:/app", "labels:/app/generated-labels"]
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_started}
  migrate:
    image: syncmark-demo-api
    command: alembic upgrade head
    environment: {PYTHONPATH: /app/src}
    volumes: [".:/app"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: .
    image: syncmark-demo-api
    command: python -m syncmark_demo.worker
    environment: {PYTHONPATH: /app/src}
    volumes: [".:/app", "labels:/app/generated-labels"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_started}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syncmark_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d syncmark_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-alpine
volumes:
  labels:
