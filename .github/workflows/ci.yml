name: quality
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: '3.12'}
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q
